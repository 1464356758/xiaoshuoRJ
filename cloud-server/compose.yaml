services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      PUBLIC_ORIGIN: https://${PUBLIC_HOST}
      PORT: 8080
    volumes:
      - novel_data:/data
    healthcheck:
      test: ["CMD", "node", "cloud-server/healthcheck.mjs"]
      interval: 15s
      timeout: 5s
      retries: 16
      start_period: 15s
    stop_grace_period: 150s
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
volumes:
  novel_data:
  caddy_data:
  caddy_config:
